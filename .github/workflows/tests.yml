name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Cache llama.cpp
        uses: actions/cache@v4
        with:
          path: Vendor/llama.xcframework
          key: llama-${{ hashFiles('scripts/build-llama.sh') }}
      - name: Build llama.cpp
        run: |
          brew install cmake
          ./scripts/build-llama.sh
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Run tests
        run: |
          xcodebuild test \
            -project QuietGPT.xcodeproj \
            -scheme QuietGPT \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            CODE_SIGNING_ALLOWED=NO
